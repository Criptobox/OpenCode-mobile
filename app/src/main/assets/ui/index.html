<style>
 :root{color-scheme:dark;--bg:#050D1A;--card:#101F34;--text:#F5F7FF;--muted:#9FB0C8;--acc:#6554FF;--soft:#182B47;--sofft:#BFC5FF;--mint:#123D37;--mintt:#64F0BB;--amber:#3B2D18;--ambert:#FFD18A;--nav:#081426;--sh:0 8px 26px rgba(0,0,0,.25);--del:#421F2D;--delt:#FFB3C0}

.brandmark{width:54px;height:54px;border-radius:19px;background:linear-gradient(135deg,#7458FF,#396EFF);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #554bff55}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:128px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:9px}.tile .ico{width:42px;height:42px}.tile strong{font-size:15px}.tile span:last-child{font-size:12px;color:var(--muted);line-height:1.35}

</style></head><body>
<div id="view"></div>
<script>
const $=s=>document.querySelector(s), J={'content-type':'application/json'};
const api=(p,o)=>fetch(p,o).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.status===204?null:r.json().catch(()=>null)});
const st={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={sessions:[],models:[],model:st.get('model',null),cur:null,msgs:[],busy:false,perm:null,err:'',catalogAt:0,catalogError:'',refreshing:false,requestStarted:0,lastProgress:0,requestError:'',lastAssistantText:'',polling:false,firstTokenAt:0,modelQuery:'',modelFavorites:st.get('modelFavorites',[]),latencyStats:st.get('latencyStats',{})};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(d,n=22)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const I={home:'M3 11l9-7 9 7v9H3z',star:'M12 3l2.5 6 6.5.5-5 4.3 1.6 6.4L12 16.5 6.4 20.2 8 13.8 3 9.5 9.5 9z',cls:'M4 5h16v14H4zM8 10l3 2-3 2M13 15h4',back:'M15 5l-7 7 7 7',send:'M5 12h14M13 6l6 6-6 6',stop:'M7 7h10v10H7z',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',chat:'M4 5h16v11H9l-5 4z',plus:'M12 5v14M5 12h14',check:'M5 12l4 4 10-10'};
function md(s){s=esc(s);s=s.replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>'<pre>'+c+'</pre>');s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');return s.split(/(<pre>[\s\S]*?<\/pre>)/).map(x=>x.startsWith('<pre>')?x:x.replace(/\n/g,'<br>')).join('')}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'ahora';if(s<3600)return'hace '+Math.floor(s/60)+' min';if(s<86400)return'hace '+Math.floor(s/3600)+' h';return'hace '+Math.floor(s/86400)+' d'}
const curModel=()=>S.models.find(m=>S.model&&m.p===S.model.p&&m.id===S.model.id);

async function loadModels(manual=false){
  if(S.refreshing)return;S.refreshing=true;S.catalogError='';
  if(manual){S.err='Actualizando catálogo oficial…';route()}
  try{
    // Current provider config gives the effective per-token prices used by this OpenCode instance.
    const r=await api('/config/providers'),ps=Array.isArray(r.providers)?r.providers:Object.values(r.providers||{}),configured=[];
    for(const p of ps){
      const pid=String(p.id||'').toLowerCase(),pn=String(p.name||p.id||'');
      // Only OpenCode Zen models are shown in the zero-cost list; unrelated BYOK providers are excluded.
      if(!(pid.includes('opencode')||pid==='zen'||pn.toLowerCase().includes('opencode zen')))continue;
      const ms=p.models||{};
      for(const id in ms){const m=ms[id],c=m.cost||{};
        const costs=[c.input,c.output,(c.cache_read??(c.cache&&c.cache.read)),(c.cache_write??(c.cache&&c.cache.write))];
        const known=costs.every(v=>v!==null&&v!==undefined&&Number.isFinite(Number(v)));
        const zero=known&&costs.every(v=>Number(v)===0);
        configured.push({p:p.id,pn:p.name||p.id,id:m.id||id,name:m.name||id,free:zero,priceKnown:known,sourceVerified:false});
      }
    }
    // Verify existence against OpenCode's official Zen model endpoint. Fail closed if it cannot be checked.
    const official=await fetch('/m/zen-models',{cache:'no-store'}).then(async x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.json()});
    if(official.error)throw new Error(official.message||'Catálogo oficial no disponible');
    const raw=Array.isArray(official)?official:(official.data||official.models||[]);
    const ids=new Set(raw.map(x=>String(typeof x==='string'?x:(x.id||x.name||''))).filter(Boolean));
    if(!ids.size)throw new Error('La fuente oficial no devolvió modelos reconocibles');
    // Require both official catalogue presence and explicit zero pricing from OpenCode config.
    S.models=configured.filter(m=>ids.has(m.id)&&m.free).map(m=>({...m,sourceVerified:true}));
    S.models.sort((a,b)=>a.name.localeCompare(b.name));
    S.catalogAt=Date.now();
    if(!S.models.some(m=>S.model&&m.p===S.model.p&&m.id===S.model.id)){
      const f=S.models[0];S.model=f?{p:f.p,id:f.id}:null;st.set('model',S.model);
    }
    if(!S.models.length)S.catalogError='No hay modelos que cumplan todas las verificaciones. No se mostrarán modelos de precio desconocido o distinto de $0.';
    S.err='';
  }catch(e){
    S.models=[];S.catalogError='No se pudo verificar el catálogo oficial y el precio. Conexión: '+String(e.message||e)+'. Por seguridad no se mostrarán modelos como gratuitos.';
    S.err='No se pudo verificar el catálogo gratuito';
  }finally{S.refreshing=false;if(location.hash==='#/models'||manual)route()}
}
async function loadSessions(){const r=await api('/session');S.sessions=(r||[]).sort((a,b)=>((b.time||{}).updated||0)-((a.time||{}).updated||0))}
async function loadMsgs(){
  if(!S.cur||S.polling)return;
  S.polling=true;
  try{
    const fresh=await api('/session/'+S.cur+'/message');
    if(!Array.isArray(fresh))throw new Error('Respuesta de mensajes no válida');
    S.msgs=fresh;
    const assistants=fresh.filter(m=>m&&m.info&&m.info.role==='assistant');
    const last=assistants[assistants.length-1];
    const completed=!!(last&&last.info&&last.info.time&&last.info.time.completed);
    const latestText=last&&Array.isArray(last.parts)?last.parts.filter(p=>p.type==='text').map(p=>p.text||'').join(''):'';
    if(latestText!==S.lastAssistantText){S.lastAssistantText=latestText;S.lastProgress=Date.now();if(latestText.trim()&&!S.firstTokenAt&&S.requestStarted){S.firstTokenAt=Date.now();const key=S.model?S.model.p+'/'+S.model.id:'unknown';const stats=S.latencyStats[key]||{n:0,total:0,last:0};stats.n++;stats.last=S.firstTokenAt-S.requestStarted;stats.total+=stats.last;S.latencyStats[key]=stats;st.set('latencyStats',S.latencyStats)}}
    if(S.busy&&last&&completed){S.busy=false;S.requestError='';S.requestStarted=0}
    drawMsgs();
  }catch(e){S.requestError='No se pudo actualizar la respuesta: '+String(e.message||e);drawMsgs()}finally{S.polling=false}
}

function nav(on){return `<nav class="nav"><a href="#/" class="${on==='h'?'on':''}">${ic(I.home,20)}<span>Inicio</span></a><a href="#/sessions" class="${on==='p'?'on':''}">${ic(I.chat,20)}<span>Proyectos</span></a><a href="#/models" class="${on==='m'?'on':''}">${ic(I.star,20)}<span>Modelos</span></a><a href="/">${ic(I.cls,20)}<span>Ajustes</span></a></nav>`}
function route(){
  const h=location.hash||'#/',v=$('#view');S.cur=null;
  if(h.startsWith('#/s/')){S.cur=h.slice(4);v.style.padding='0';v.innerHTML=chatShell();bindChat();loadMsgs();return}
  v.style.padding='28px 20px 110px';
  if(h==='#/sessions'){v.innerHTML=sessionsView();v.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>location.hash='#/s/'+e.dataset.s);const n=$('#new');if(n)n.onclick=newSession}
  else if(h==='#/models'){v.innerHTML=modelsView();const refresh=$('#refreshModels');if(refresh)refresh.onclick=()=>loadModels(true);const search=$('#modelSearch');if(search)search.oninput=()=>{S.modelQuery=search.value;const pos=search.selectionStart;route();const next=$('#modelSearch');if(next){next.focus();next.setSelectionRange(pos,pos)}};v.querySelectorAll('[data-fav]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const k=e.dataset.fav;S.modelFavorites=S.modelFavorites.includes(k)?S.modelFavorites.filter(x=>x!==k):[...S.modelFavorites,k];st.set('modelFavorites',S.modelFavorites);route()});v.querySelectorAll('[data-m]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-fav]'))return;const[p,id]=e.dataset.m.split('|');S.model={p,id};st.set('model',S.model);route()})}
  else{v.innerHTML=homeView();$('#new').onclick=newSession;v.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>location.hash='#/s/'+e.dataset.s)}
}
function homeView(){const m=curModel();
  const count=S.sessions.length;
  return `<div class="row" style="gap:14px"><div class="brandmark">${ic(I.cls,29)}</div><div class="grow"><div style="font-size:21px;font-weight:800;letter-spacing:-.4px">OpenCode <span style="color:#9E9AFF">Mobile</span></div><div class="muted sm">Tu espacio para crear con IA</div></div><a class="rb" href="/" aria-label="Ajustes">${ic(I.cls,21)}</a></div>
  ${S.err?`<div class="note">${esc(S.err)}</div>`:''}
  <div class="card" style="margin-top:20px;padding:17px"><div class="row sp"><div class="row"><span style="width:11px;height:11px;border-radius:50%;background:#45E2A3;box-shadow:0 0 12px #45E2A388"></span><b>Motor OpenCode</b></div><span class="badge g">Activo</span></div><div style="margin-top:12px;font-weight:650">${esc(m?m.name:'Selecciona un modelo')}</div><div class="muted sm" style="margin-top:4px">${m&&S.models.some(x=>x.p===m.p&&x.id===m.id&&x.sourceVerified)?'Modelo gratuito verificado':'Elige un modelo en el catálogo oficial'}</div></div>
  <h2 style="margin-top:25px">¿Qué quieres hacer?</h2><div class="tiles">
  <a class="card tile" href="#/sessions"><span class="ico">${ic(I.chat,23)}</span><strong>Programar</strong><span>Preguntar, escribir y reparar código</span></a>
  <a class="card tile" href="#/sessions"><span class="ico" style="background:linear-gradient(135deg,#278EFF,#365BFF)">${ic('M3 4h18v16H3zM7 8h10M7 12h7M7 16h5',23)}</span><strong>Crear una web</strong><span>Describe tu idea en el chat</span></a>
  <a class="card tile" href="#/sessions"><span class="ico" style="background:linear-gradient(135deg,#FF4E9B,#E83D72)">${ic(I.cls,23)}</span><strong>Mis proyectos</strong><span>${count} sesiones recientes</span></a>
  <a class="card tile" href="#/models"><span class="ico">${ic(I.star,23)}</span><strong>Modelos IA</strong><span>Solo gratuitos verificados</span></a></div>
  <div class="hero"><div class="row"><span style="font-size:25px">✦</span><div class="grow"><b>Empieza con una idea</b><div class="sm" style="opacity:.85">Crea un proyecto nuevo con tu modelo activo</div></div></div><button class="btn" id="new">＋ Nueva conversación</button></div>
  <h2>Recientes</h2><div class="list">${S.sessions.slice(0,4).map(s=>`<div class="card row" data-s="${esc(s.id)}"><div class="ico">${ic(I.chat,21)}</div><div class="grow"><div class="t">${esc(s.title||'Sesión nueva')}</div><div class="muted sm">${ago((s.time||{}).updated||Date.now())}</div></div>${ic(I.back,18)}</div>`).join('')||'<div class="card empty muted">Todavía no hay conversaciones. Crea una para empezar.</div>'}</div>${nav('h')}`}
function sessionsView(){return `<div class="row sp"><div><div class="muted sm">TU ESPACIO</div><h1>Mis proyectos</h1></div><button class="rb" id="new">${ic(I.plus,22)}</button></div><div class="muted sm" style="margin:8px 0 18px">Conversaciones y trabajos recientes</div><div class="list">${S.sessions.map(s=>`<div class="card row" data-s="${esc(s.id)}"><div class="ico">${ic(I.chat,21)}</div><div class="grow"><div class="t">${esc(s.title||'Sesión nueva')}</div><div class="muted sm">${ago((s.time||{}).updated||Date.now())}</div></div>${ic(I.back,18)}</div>`).join('')||'<div class="card empty muted">No hay proyectos todavía.</div>'}</div>${nav('p')}`}
function modelsView(){
  const query=S.modelQuery.toLowerCase().trim();
  const visible=S.models.filter(m=>!query||(m.name+' '+m.id+' '+m.pn).toLowerCase().includes(query));
  const key=m=>m.p+'/'+m.id;
  const opt=m=>{const selected=curModel()&&curModel().p===m.p&&curModel().id===m.id;const fav=S.modelFavorites.includes(key(m));const stat=S.latencyStats[key(m)];return `<div class="card opt ${selected?'sel':''}" data-m="${esc(m.p)}|${esc(m.id)}"><div class="grow"><div class="t">${esc(m.name)}</div><div class="muted sm">${esc(m.pn)} · ${esc(m.id)}</div><div class="muted sm">${stat?'Primera respuesta media: '+Math.round(stat.total/stat.n/1000)+' s · última: '+(stat.last/1000).toFixed(1)+' s':'Aún sin medición local'}</div></div><button class="rb favModel" data-fav="${esc(key(m))}" aria-label="Favorito" style="width:38px;height:38px;color:${fav?'#FFD18A':'#9FB0C8'}">★</button><span class="badge g">$0 verificado</span><span class="dot">${selected?ic(I.check,14):''}</span></div>`};
  const checked=S.catalogAt?`Última comprobación: ${new Date(S.catalogAt).toLocaleString()}`:'Aún no se ha completado una comprobación';
  return `<h1>Modelos gratuitos</h1><div class="muted sm" style="margin-top:4px">Solo OpenCode Zen · precio cero verificado</div>
  <div class="note">Se comprueba el catálogo oficial y el precio de entrada, salida y caché. Si una fuente falla o un precio es desconocido, el modelo se excluye.</div>
  <input id="modelSearch" value="${esc(S.modelQuery)}" placeholder="Buscar modelo por nombre…" style="width:100%;margin-top:14px;padding:14px;border-radius:15px;border:1px solid #263D5C;background:#101F34;color:var(--text);font:inherit">
  <div class="muted sm" style="margin-top:8px">${S.modelFavorites.length?'Favoritos guardados: '+S.modelFavorites.length:'Marca ★ para guardar tus modelos favoritos'} · Las mediciones se registran localmente tras usar cada modelo.</div>
  <button class="btn p" id="refreshModels" style="margin-top:14px" ${S.refreshing?'disabled':''}>${S.refreshing?'Comprobando…':'↻ Actualizar modelos oficiales'}</button>
  <div class="muted sm" style="margin:10px 2px">${esc(checked)}</div>
  ${S.catalogError?`<div class="note">${esc(S.catalogError)}</div>`:''}
  <div class="list" style="margin-top:16px">${visible.map(opt).join('')||'<div class="card empty muted">No hay modelos que coincidan con la búsqueda o no hay modelos gratuitos verificados. Actualiza el catálogo o cambia la búsqueda.</div>'}</div>
  <a href="/" style="text-decoration:none"><button class="btn s" style="margin-top:18px;box-shadow:var(--sh)">Proveedores y ajustes avanzados</button></a>${nav('m')}`}
function chatShell(){const s=S.sessions.find(x=>x.id===S.cur),m=curModel();
  return `<div class="chat"><div class="top"><button class="rb" id="bk" aria-label="Volver">${ic(I.back,20)}</button><div class="grow"><div class="t" style="font-size:16px;font-weight:700">${esc(s?s.title:'Sesión')}</div><div class="muted sm">${esc(m?m.name:'')}</div></div><button class="rb" id="del" aria-label="Eliminar">${ic(I.trash,20)}</button></div>
  <div id="msgs"></div><div id="perm"></div>
  <div class="comp"><textarea id="inp" rows="1" placeholder="Mensaje o /comando"></textarea><button class="send" id="go" aria-label="Enviar">${ic(I.send,20)}</button></div></div>`}
function bindChat(){
  $('#bk').onclick=()=>{location.hash='#/'};
  $('#del').onclick=async()=>{if(confirm('¿Eliminar esta sesión?')){try{await api('/session/'+S.cur,{method:'DELETE'})}catch(e){}await loadSessions();location.hash='#/'}};
  const i=$('#inp');i.oninput=()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'};
  $('#go').onclick=async()=>{
    if(S.busy){try{await api('/session/'+S.cur+'/abort',{method:'POST'})}catch(e){}S.busy=false;S.requestStarted=0;drawMsgs();return}
    const t=i.value.trim();if(!t)return;i.value='';i.style.height='auto';
    const b={parts:[{type:'text',text:t}]};if(S.model)b.model={providerID:S.model.p,modelID:S.model.id};
    S.busy=true;S.requestStarted=Date.now();S.lastProgress=Date.now();S.firstTokenAt=0;S.requestError='';S.lastAssistantText='';
    S.msgs.push({info:{role:'user'},parts:[{type:'text',text:t}]});drawMsgs();
    try{
      await api('/session/'+S.cur+'/prompt_async',{method:'POST',headers:J,body:JSON.stringify(b)});
      setTimeout(loadMsgs,250);
    }catch(e){S.busy=false;S.requestStarted=0;S.requestError='No se pudo enviar el mensaje: '+String(e.message||e);drawMsgs()}
  };
  i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#go').click()}};
  drawPerm();
}
function drawMsgs(){const box=$('#msgs');if(!box)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=(S.requestError?`<div class="note">${esc(S.requestError)}<br><button class="btn s" id="retryLoad" style="margin-top:8px">Actualizar respuesta</button></div>`:'')+S.msgs.map(m=>{const r=m.info.role,ps=m.parts||[];
    if(r==='user')return `<div class="b u">${md(ps.filter(p=>p.type==='text').map(p=>p.text).join('\n'))}</div>`;
    return ps.map(p=>{
      if(p.type==='text'&&p.text&&p.text.trim())return `<div class="b a">${md(p.text)}</div>`;
      if(p.type==='tool'){const s=p.state||{},inp=s.input||{},d=s.title||inp.filePath||inp.command||inp.pattern||'';return `<div class="tool">${esc(p.tool)} ${esc(d)} ${s.status==='completed'?'· listo':s.status==='error'?'· error':'…'}</div>`}
      return''}).join('')}).join('')+(S.busy?`<div class="tool">Generando · ${S.requestStarted?Math.floor((Date.now()-S.requestStarted)/1000):0} s${S.firstTokenAt?' · primera respuesta '+((S.firstTokenAt-S.requestStarted)/1000).toFixed(1)+' s':''}${S.lastProgress&&Date.now()-S.lastProgress>20000?' · sin texto nuevo recientemente':''}</div>`:'');
  const retry=$('#retryLoad');if(retry)retry.onclick=()=>{S.requestError='';loadMsgs()};
  const g=$('#go');if(g)g.innerHTML=ic(S.busy?I.stop:I.send,20);
  if(near)box.scrollTop=box.scrollHeight}
function drawPerm(){const e=$('#perm');if(!e)return;const p=S.perm;
  e.innerHTML=p?`<div class="perm"><b>Permiso solicitado</b><div class="c">${esc(p.title)}${p.detail?'<br>'+esc(p.detail):''}</div><div class="row"><button class="btn p" id="ok">Permitir</button><button class="btn s" id="no">Denegar</button></div></div>`:'';
  if(p){$('#ok').onclick=()=>answer('once');$('#no').onclick=()=>answer('reject')}}
async function answer(k){const p=S.perm;S.perm=null;drawPerm();
  try{await api('/permission/'+p.id+'/reply',{method:'POST',headers:J,body:JSON.stringify({reply:k})})}
  catch(e){try{await api('/session/'+p.sessionID+'/permissions/'+p.id,{method:'POST',headers:J,body:JSON.stringify({response:k})})}catch(x){}}}
async function newSession(){try{const s=await api('/session',{method:'POST',headers:J,body:'{}'});S.sessions.unshift(s);location.hash='#/s/'+s.id}catch(e){S.err='No se pudo crear la sesión';route()}}

let deb;function ev(e){let d;try{d=JSON.parse(e.data)}catch(x){return}const t=d.type||'',p=d.properties||{};
  if(/permission/.test(t)){if(/replied/.test(t)){S.perm=null}else{const id=p.id||p.requestID;if(id)S.perm={id,sessionID:p.sessionID,title:p.title||p.permission||'Ejecutar acción',detail:(p.metadata&&(p.metadata.command||p.metadata.filePath))||(p.patterns||[]).join(', ')}}drawPerm();return}
  if(/^session\.error/.test(t)){S.requestError='OpenCode notificó un error durante la generación.';S.busy=false;S.requestStarted=0;drawMsgs()}
  if(/^session\.(idle|status)/.test(t)&&S.cur&&/idle/.test(t)){clearTimeout(deb);deb=setTimeout(loadMsgs,100)}
  if(/^message\./.test(t)&&S.cur){clearTimeout(deb);deb=setTimeout(loadMsgs,100)}
  if(/^session\.(updated|created|deleted)/.test(t)&&!S.cur)loadSessions().then(route)}
try{const es=new EventSource('/event');es.onmessage=ev}catch(e){}
// Actualiza el chat con mayor frecuencia mientras OpenCode genera la respuesta.
setInterval(()=>{if(S.cur&&S.busy){loadMsgs()}},900);
window.onhashchange=route;
(async()=>{try{await Promise.all([loadModels(),loadSessions()])}catch(e){S.err='No pude cargar datos del servidor'}route()})();
</script></body></html>
